# Lokal ishlash: faqat MongoDB. API hostda `npm run dev` bilan ishlaydi.
services:
  mongodb:
    image: mongo:7
    container_name: lokma-toyxonalar-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  mongo_data:
